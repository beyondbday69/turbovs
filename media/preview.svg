<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" style="background:#1e1e1e; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="dos-glow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0055aa" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- VS CODE WINDOW BACKGROUND -->
  <rect width="1280" height="720" fill="#1e1e1e"/>

  <!-- TITLE BAR -->
  <rect width="1280" height="35" fill="#323233"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text x="640" y="22" fill="#cccccc" font-size="12" text-anchor="middle">hello.cpp - TurboVs - Visual Studio Code</text>

  <!-- ACTIVITY BAR (LEFT) -->
  <rect x="0" y="35" width="48" height="663" fill="#333333"/>
  <!-- File icon -->
  <path d="M16 55 L32 55 L32 80 L16 80 Z" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="20" y1="62" x2="28" y2="62" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="20" y1="68" x2="28" y2="68" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Search icon -->
  <circle cx="24" cy="105" r="6" fill="none" stroke="#858585" stroke-width="2"/>
  <line x1="28" y1="109" x2="33" y2="114" stroke="#858585" stroke-width="2"/>
  <!-- Extensions icon -->
  <rect x="18" y="135" width="6" height="6" fill="#858585"/>
  <rect x="26" y="135" width="6" height="6" fill="#858585"/>
  <rect x="18" y="143" width="6" height="6" fill="#858585"/>
  <rect x="26" y="143" width="6" height="6" fill="#858585"/>

  <!-- SIDEBAR (EXPLORER) -->
  <rect x="48" y="35" width="220" height="663" fill="#252526"/>
  <text x="64" y="58" fill="#bbbbbb" font-size="11" font-weight="bold" letter-spacing="1">EXPLORER</text>
  <text x="64" y="82" fill="#ffffff" font-size="12" font-weight="bold">▼ TURBOVS-PROJECT</text>
  <text x="76" y="104" fill="#3b99fc" font-size="12">C++ hello.cpp</text>
  <text x="76" y="126" fill="#cccccc" font-size="12">C++ calculator.cpp</text>
  <text x="76" y="148" fill="#cccccc" font-size="12">C++ graphics_demo.cpp</text>
  <text x="76" y="170" fill="#858585" font-size="12">⚙ settings.json</text>

  <!-- MAIN EDITOR TOP TABS -->
  <rect x="268" y="35" width="1012" height="35" fill="#2d2d2d"/>
  <rect x="268" y="35" width="160" height="35" fill="#1e1e1e"/>
  <rect x="268" y="35" width="160" height="2" fill="#007acc"/>
  <text x="288" y="57" fill="#3b99fc" font-size="12" font-weight="bold">C++</text>
  <text x="316" y="57" fill="#ffffff" font-size="13">hello.cpp</text>
  <text x="412" y="56" fill="#858585" font-size="12">✕</text>

  <!-- EDITOR ACTION BUTTONS (PLAY / STOP / RUN WITH TURBOVS) -->
  <g transform="translate(1140, 42)">
    <!-- Play button (highlighted) -->
    <circle cx="16" cy="10" r="14" fill="#0e639c"/>
    <polygon points="12,5 24,10 12,15" fill="#ffffff"/>
    <!-- Tooltip badge -->
    <rect x="-95" y="24" width="130" height="20" rx="3" fill="#252526" stroke="#454545"/>
    <text x="-30" y="38" fill="#ffffff" font-size="10" text-anchor="middle">TurboVs: Run (Ctrl+F9)</text>
    <!-- Stop button -->
    <circle cx="48" cy="10" r="14" fill="#333333"/>
    <rect x="43" y="5" width="10" height="10" fill="#e51400"/>
    <!-- More options -->
    <circle cx="80" cy="7" r="1.5" fill="#cccccc"/>
    <circle cx="80" cy="11" r="1.5" fill="#cccccc"/>
    <circle cx="80" cy="15" r="1.5" fill="#cccccc"/>
  </g>

  <!-- CODE EDITOR AREA -->
  <rect x="268" y="70" width="1012" height="400" fill="#1e1e1e"/>

  <!-- Line numbers -->
  <g fill="#858585" font-size="13" font-family="'Consolas', 'Courier New', monospace">
    <text x="285" y="105">1</text>
    <text x="285" y="128">2</text>
    <text x="285" y="151">3</text>
    <text x="285" y="174">4</text>
    <text x="285" y="197">5</text>
    <text x="285" y="220">6</text>
    <text x="285" y="243">7</text>
    <text x="285" y="266">8</text>
    <text x="285" y="289">9</text>
    <text x="277" y="312">10</text>
    <text x="277" y="335">11</text>
    <text x="277" y="358">12</text>
    <text x="277" y="381">13</text>
    <text x="277" y="404">14</text>
    <text x="277" y="427">15</text>
    <text x="277" y="450">16</text>
  </g>

  <!-- CODE SYNTAX HIGHLIGHTING -->
  <g font-size="14" font-family="'Consolas', 'Courier New', monospace">
    <!-- #include <iostream.h> -->
    <text x="320" y="105"><tspan fill="#c586c0">#include</tspan> <tspan fill="#ce9178">&lt;iostream.h&gt;</tspan></text>
    <!-- #include <conio.h> -->
    <text x="320" y="128"><tspan fill="#c586c0">#include</tspan> <tspan fill="#ce9178">&lt;conio.h&gt;</tspan></text>
    
    <!-- void main() { -->
    <text x="320" y="174"><tspan fill="#569cd6">void</tspan> <tspan fill="#dcdcaa">main</tspan>() {</text>
    
    <!-- clrscr(); -->
    <text x="350" y="197"><tspan fill="#dcdcaa">clrscr</tspan>();</text>
    
    <!-- cout << "===============================" << endl; -->
    <text x="350" y="243"><tspan fill="#4ec9b0">cout</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#ce9178">"=== TurboVs in Visual Studio Code ==="</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#4ec9b0">endl</tspan>;</text>
    
    <!-- char name[50]; -->
    <text x="350" y="266"><tspan fill="#569cd6">char</tspan> <tspan fill="#9cdcfe">name</tspan>[<tspan fill="#b5cea8">50</tspan>];</text>
    
    <!-- cout << "Enter your name: "; -->
    <text x="350" y="289"><tspan fill="#4ec9b0">cout</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#ce9178">"Enter your name: "</tspan>;</text>
    
    <!-- cin >> name; -->
    <text x="350" y="312"><tspan fill="#4ec9b0">cin</tspan> <tspan fill="#d4d4d4">&gt;&gt;</tspan> <tspan fill="#9cdcfe">name</tspan>;</text>
    
    <!-- cout << "
Hello, " << name << "!" << endl; -->
    <text x="350" y="358"><tspan fill="#4ec9b0">cout</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#ce9178">"\nWelcome, "</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#9cdcfe">name</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#ce9178">"! Press any key..."</tspan> <tspan fill="#d4d4d4">&lt;&lt;</tspan> <tspan fill="#4ec9b0">endl</tspan>;</text>
    
    <!-- getch(); -->
    <text x="350" y="404"><tspan fill="#dcdcaa">getch</tspan>();</text>
    
    <!-- } -->
    <text x="320" y="427"><tspan fill="#d4d4d4">}</tspan></text>
  </g>

  <!-- BOTTOM PANEL: INTEGRATED TERMINAL (TURBOVS) -->
  <rect x="268" y="470" width="1012" height="228" fill="#181818" stroke="#2b2b2b" stroke-width="1"/>
  
  <!-- Terminal panel tab header -->
  <rect x="268" y="470" width="1012" height="30" fill="#252526"/>
  <text x="288" y="490" fill="#858585" font-size="11" font-weight="bold">PROBLEMS</text>
  <text x="370" y="490" fill="#858585" font-size="11" font-weight="bold">OUTPUT</text>
  <text x="440" y="490" fill="#858585" font-size="11" font-weight="bold">DEBUG CONSOLE</text>
  <text x="545" y="490" fill="#ffffff" font-size="11" font-weight="bold">TERMINAL</text>
  <rect x="540" y="498" width="65" height="2" fill="#007acc"/>
  
  <!-- Terminal instance dropdown / title -->
  <rect x="1170" y="475" width="90" height="20" rx="3" fill="#333333"/>
  <text x="1180" y="489" fill="#00ffff" font-size="11" font-family="'Consolas', monospace">⚡ TurboVs</text>

  <!-- Terminal log text -->
  <g font-size="12" font-family="'Consolas', 'Courier New', monospace">
    <text x="288" y="522" fill="#4ec9b0">[TurboVs]</text>
    <text x="360" y="522" fill="#d4d4d4">Compiling and Running: hello.cpp</text>
    
    <text x="288" y="542" fill="#4ec9b0">[TurboVs]</text>
    <text x="360" y="542" fill="#d4d4d4">Compiler Directory:    C:\TURBOC3</text>
    
    <text x="288" y="562" fill="#4ec9b0">[TurboVs]</text>
    <text x="360" y="562" fill="#d4d4d4">DOSBox Executable:     C:\Program Files (x86)\DOSBox-0.74-3\DOSBox.exe</text>
    
    <text x="288" y="590" fill="#00ff88">✔ Compilation successful (0 errors, 0 warnings)</text>
    <text x="288" y="612" fill="#3b99fc">➜ Launching interactive DOSBox window...</text>
    <text x="288" y="634" fill="#858585">Watching program execution (PID: 4920)...</text>
  </g>

  <!-- FLOATING RETRO DOSBOX WINDOW OVERLAY -->
  <g transform="translate(680, 110)" filter="url(#shadow)">
    <!-- DOSBox Window Frame -->
    <rect width="560" height="380" rx="6" fill="#1b1b22" stroke="#444455" stroke-width="2"/>
    
    <!-- DOSBox Title Bar -->
    <rect width="560" height="28" rx="6" fill="#000084"/>
    <rect y="22" width="560" height="6" fill="#000084"/>
    <text x="280" y="19" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="'Courier New', monospace">DOSBox 0.74-3 - Turbo C++ Runner (CPU: 3000 cycles)</text>
    
    <!-- Close / Min / Max icons in DOS style -->
    <rect x="536" y="6" width="16" height="16" fill="#aaaaaa" stroke="#ffffff"/>
    <text x="544" y="18" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">✕</text>

    <!-- CRT Screen Area (Classic Borland Blue Screen) -->
    <rect x="8" y="32" width="544" height="340" fill="#0000a8"/>
    
    <!-- Classic DOS double line box -->
    <rect x="18" y="42" width="524" height="60" fill="none" stroke="#ffff55" stroke-width="1.5"/>
    <text x="280" y="67" fill="#ffff55" font-size="15" font-weight="bold" text-anchor="middle" font-family="'Courier New', monospace">Turbo C++ Runner for VS Code</text>
    <text x="280" y="87" fill="#ffffff" font-size="13" text-anchor="middle" font-family="'Courier New', monospace">Source: HELLO.CPP | Drive: D:\</text>
    
    <!-- Running Program Output in VGA Font Style -->
    <g font-size="14" font-family="'Courier New', monospace" font-weight="bold">
      <text x="26" y="130" fill="#55ffff">[1/2] Compiling with Turbo C++ (TCC)...</text>
      <text x="26" y="152" fill="#55ff55">✔ Compilation Successful! Launching program...</text>
      <line x1="26" y1="168" x2="530" y2="168" stroke="#5555ff" stroke-width="1"/>
      
      <text x="26" y="196" fill="#ffff55">=== TurboVs in Visual Studio Code ===</text>
      <text x="26" y="224" fill="#ffffff">Enter your name: Alice</text>
      <text x="26" y="256" fill="#ffffff">Welcome, Alice! Press any key to exit...</text>
      
      <!-- Blinking Cursor -->
      <rect x="420" y="244" width="10" height="14" fill="#ffffff"/>
      
      <text x="26" y="320" fill="#aaaaaa">---------------------------------------------</text>
      <text x="26" y="342" fill="#55ffff">Execution finished. Press any key to exit DOSBox...</text>
    </g>
  </g>

  <!-- VS CODE STATUS BAR (BOTTOM) -->
  <rect y="698" width="1280" height="22" fill="#007acc"/>
  
  <!-- Status bar item for TurboVs -->
  <g transform="translate(10, 702)">
    <text x="10" y="13" fill="#ffffff" font-size="12" font-weight="bold">⚡ TurboVs: Ready</text>
  </g>
  
  <text x="180" y="715" fill="#ffffff" font-size="11">C:\TURBOC3</text>
  <text x="280" y="715" fill="#ffffff" font-size="11">DOSBox: Ready</text>
  
  <!-- Right status bar items -->
  <text x="1100" y="715" fill="#ffffff" font-size="11">Ln 12, Col 18</text>
  <text x="1180" y="715" fill="#ffffff" font-size="11">UTF-8</text>
  <text x="1230" y="715" fill="#ffffff" font-size="11">C++</text>
</svg>
