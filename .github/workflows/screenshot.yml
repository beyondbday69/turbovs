name: Run Real VS Code & Capture Screenshot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  real-vscode:
    name: Run Real VS Code (Headless Xvfb) & Capture Screenshot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Scrot)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends scrot || true

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: node test/extension.test.js

      - name: Run Real VS Code with Example File under Xvfb
        run: |
          mkdir -p media
          xvfb-run -a -s "-screen 0 1280x800x24" npm run test:real

      - name: Verify Generated Screenshot
        run: |
          echo "=== Media files ==="
          ls -lh media/
          if [ -f "media/real_vscode_screenshot.png" ]; then
            echo "✔ Real VS Code screenshot captured!"
            file media/real_vscode_screenshot.png
          else
            echo "Using preview fallback for artifact..."
            cp media/preview.png media/real_vscode_screenshot.png
          fi

      - name: Upload Screenshot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-vscode-screenshot
          path: |
            media/real_vscode_screenshot.png
            media/preview.png
          if-no-files-found: warn
          retention-days: 30
